{% extends "base.html" %}
{% block title %}エラー - Log Server{% endblock %}
{% block content %}
<div class="page-header">
    <a class="page-header-back" href="{{ PREFIX }}/projects">プロジェクト一覧</a>
    {% if project %}
    <span class="page-header-sep">›</span>
    <a class="page-header-back" href="{{ project_url(project.slug, '/list') }}">{{ project.name }}</a>
    {% endif %}
</div>
<div class="ui-narrow">
    <div class="ui-card">
        <div class="ui-card-body" style="display:flex; gap:14px; align-items:flex-start;">
            <div style="flex-shrink:0; width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:rgba(227,201,90,0.15); border:1px solid rgba(227,201,90,0.35); color:#e3c95a;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <div>
                <h5 class="ui-card-title" style="margin-bottom:6px;">表示できません</h5>
                <p class="ui-muted" style="margin:0; font-size:13.5px; color:var(--text-primary);">{{ message }}</p>
            </div>
        </div>
        <div class="ui-card-foot">
            <span class="ui-muted">URL を確認するか、プロジェクト一覧から辿ってください</span>
            <a class="btn-ghost" href="{{ PREFIX }}/projects">プロジェクト一覧へ</a>
        </div>
    </div>
</div>
{% endblock %}
