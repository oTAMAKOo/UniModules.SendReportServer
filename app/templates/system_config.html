{% extends "base.html" %}
{% block title %}システム設定 - Log Server{% endblock %}
{% block content %}
<div class="page-header">
    <a class="page-header-back" href="{{ PREFIX }}/admin">管理メニュー</a>
    <span class="page-header-sep">›</span>
    <span class="page-header-title">システム設定</span>
</div>
<div class="ui-narrow">
    {% if message %}
    <div class="alert alert-success">{{ message }}</div>
    {% endif %}
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <div class="ui-card">
        <div class="ui-card-body">
            <h5 class="ui-card-title">セッション</h5>
            <form method="post" action="{{ PREFIX }}/system">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="field">
                    <label for="session_hours">セッション有効期限</label>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <input type="number" class="form-control" id="session_hours" name="session_hours" value="{{ session_hours }}" min="1" max="8760" style="width:140px;" required>
                        <span class="ui-muted">時間</span>
                    </div>
                    <div class="hint">ログインからこの時間を経過すると自動ログアウトされます（既定 24 時間、1〜8760）。全プロジェクト共通の設定です</div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-accent">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
