{# ユーザー一覧 / メンバー一覧で共通のスクリプト（展開パネル・権限メニュー・招待リンクコピー・パスワード表示） #}
<script>
function toggleRoleMenu(btn) {
    var menu = btn.nextElementSibling;
    var isOpen = menu.classList.contains('open');
    document.querySelectorAll('.role-menu.open').forEach(function(m) { m.classList.remove('open'); });
    if (!isOpen) menu.classList.add('open');
}
document.addEventListener('click', function(e) {
    if (!e.target.closest('.role-dropdown')) {
        document.querySelectorAll('.role-menu.open').forEach(function(m) { m.classList.remove('open'); });
    }
});
function closeAllPanels() {
    document.querySelectorAll('.inline-panel.open').forEach(function(p) {
        p.classList.remove('open');
        var pw = p.querySelector('input[name="new_password"]');
        if (pw) {
            pw.value = '';
            p.querySelector('button[type="submit"]').disabled = true;
        }
        var email = p.querySelector('input[name="email"]');
        if (email) email.value = email.defaultValue;
    });
}
function togglePanel(btn, selector) {
    var panel = btn.closest('td').querySelector(selector);
    var wasOpen = panel.classList.contains('open');
    closeAllPanels();
    if (!wasOpen) {
        panel.classList.add('open');
        var input = panel.querySelector('input:not([type="hidden"])');
        if (input && !input.disabled) input.focus();
    }
}
function closeUserPanels() {
    // 「⋯」で開いた管理パネル（行の直下の tr）を全部閉じ、入力欄を初期状態に戻す
    document.querySelectorAll('.user-edit-row.open').forEach(function(row) {
        row.classList.remove('open');
        var main = row.previousElementSibling;
        if (main) main.classList.remove('active');
        row.querySelectorAll('input[name="new_password"]').forEach(function(pw) {
            pw.value = '';
            var submit = pw.closest('form').querySelector('button[type="submit"]');
            if (submit) submit.disabled = true;
        });
        row.querySelectorAll('input[name="email"]').forEach(function(email) { email.value = email.defaultValue; });
    });
}
function toggleUserPanel(btn) {
    var main = btn.closest('tr');
    var row = main.nextElementSibling;
    var wasOpen = row.classList.contains('open');
    closeUserPanels();
    if (!wasOpen) {
        row.classList.add('open');
        main.classList.add('active');
    }
}
// 一覧の絞り込み（サーバーへ問い合わせず、描画済みの行を隠すだけ）
function applyUserFilter() {
    var bar = document.querySelector('.user-filter');
    var table = document.querySelector('.user-table');
    if (!bar || !table) return;
    var input = bar.querySelector('.filter-input');
    var terms = (input.value || '').toLowerCase().trim().split(/\s+/).filter(Boolean);
    var selects = Array.prototype.slice.call(bar.querySelectorAll('select[data-filter-attr]'));
    var rows = table.querySelectorAll('tbody > tr.user-row');
    var shown = 0;
    Array.prototype.forEach.call(rows, function(tr) {
        var hay = tr.dataset.filter || '';
        var ok = terms.every(function(t) { return hay.indexOf(t) !== -1; });
        if (ok) {
            ok = selects.every(function(sel) {
                if (!sel.value) return true;
                return (tr.dataset[sel.dataset.filterAttr] || '').split(' ').indexOf(sel.value) !== -1;
            });
        }
        tr.hidden = !ok;
        var panel = tr.nextElementSibling;
        if (panel && panel.classList.contains('user-edit-row')) {
            if (!ok) panel.classList.remove('open');
            panel.hidden = !ok;
        }
        if (ok) shown++;
    });
    var active = terms.length > 0 || selects.some(function(sel) { return !!sel.value; });
    var empty = table.querySelector('.user-filter-empty');
    if (empty) empty.hidden = shown > 0;
    var count = bar.querySelector('.user-filter-count');
    if (count) count.textContent = active ? shown + ' / ' + rows.length + ' 件' : rows.length + ' 件';
    var clear = bar.querySelector('.user-filter-clear');
    if (clear) clear.hidden = !active;
}
function clearUserFilter() {
    var bar = document.querySelector('.user-filter');
    if (!bar) return;
    bar.querySelector('.filter-input').value = '';
    bar.querySelectorAll('select[data-filter-attr]').forEach(function(sel) { sel.value = ''; });
    applyUserFilter();
    bar.querySelector('.filter-input').focus();
}
document.addEventListener('DOMContentLoaded', applyUserFilter);
function updatePwBtn(input) {
    var btn = input.closest('.pw-reset-panel').querySelector('button[type="submit"]');
    btn.disabled = input.value.length < 4;
}
function unlinkGoogle(btn) {
    // ユーザー名は JS 文字列に直接埋め込まず data 属性から読む（HTML エスケープでは JS 文字列を守れないため）
    var username = btn.form.dataset.username;
    if (!confirm(username + ' の Google 連携を解除しますか？\nこのユーザーは Google でログインできなくなります。')) return false;
    // 空の email を送ると連携解除になる（サーバー側で判定）
    btn.form.querySelector('input[name="email"]').value = '';
    return true;
}
function copyInviteUrl(btn) {
    var input = document.getElementById('invite-url');
    var done = function() {
        btn.textContent = 'コピーしました';
        setTimeout(function() { btn.textContent = 'コピー'; }, 1500);
    };
    var fallback = function() {
        input.select();
        document.execCommand('copy');
        done();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(input.value).then(done, fallback);
    } else {
        fallback();
    }
}
function togglePasswordVisibility(inputId, btn) {
    var input = document.getElementById(inputId);
    var eyeIcon = btn.querySelector('.eye-icon');
    var eyeOffIcon = btn.querySelector('.eye-off-icon');
    if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.style.display = 'none';
        eyeOffIcon.style.display = 'inline';
    } else {
        input.type = 'password';
        eyeIcon.style.display = 'inline';
        eyeOffIcon.style.display = 'none';
    }
}
</script>
