services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logserver
      POSTGRES_PASSWORD: logserver
      POSTGRES_DB: logserver
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logserver"]
      interval: 5s
      timeout: 5s
      retries: 5
    # メモリチューニング（軽量構成）の内容は docker-compose.light.yml を参照。
    # 本番は docker-compose.prod.yml の db.command に書く（-f を明示して起動すると
    # docker-compose.override.yml は自動で読み込まれないため）。
    # ローカルで試すなら: docker compose -f docker-compose.yml -f docker-compose.light.yml up -d
    # RAM 1GB 以上なら不要（PostgreSQL 既定値で動作）。

  app:
    build: .
    env_file: .env
    volumes:
      - ./app:/app/app
      - app_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - app_storage:/app/storage:ro
    depends_on:
      - app

volumes:
  pgdata:
  app_storage:
