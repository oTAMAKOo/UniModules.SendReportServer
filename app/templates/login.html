{% extends "base.html" %}
{% block title %}Login - Log Server{% endblock %}
{% block extra_css %}
<style>
    .login-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 120px);
    }
    .login-card {
        width: 100%;
        max-width: 360px;
        background: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: 12px;
        box-shadow: var(--shadow-card);
        padding: 32px;
    }
    .login-card h4 {
        color: var(--text-primary);
        font-size: 18px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 24px;
    }
    .login-card label {
        color: var(--text-secondary);
        font-size: 13px;
        margin-bottom: 4px;
    }
    .login-card .form-control {
        background: var(--bg-input);
        border: 1px solid var(--border-input);
        border-radius: 6px;
        color: var(--text-primary);
        padding: 8px 12px;
        font-size: 14px;
    }
    .login-card .form-control:focus {
        background: var(--bg-input);
        color: var(--text-primary);
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
    }
    .login-card .btn-login {
        width: 100%;
        padding: 8px;
        font-size: 14px;
        font-weight: 500;
        border: none;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition: background 0.15s;
    }
    .login-card .btn-login:hover {
        background: var(--accent-hover);
    }
    .login-card .alert {
        font-size: 13px;
        border-radius: 6px;
    }
    .pw-field-wrapper {
        position: relative;
    }
    .pw-field-wrapper .form-control {
        padding-right: 36px;
    }
    .pw-toggle-eye {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        padding: 2px;
        line-height: 0;
    }
    .pw-toggle-eye:hover { color: var(--text-primary); }
</style>
{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <h4>Log Server</h4>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ PREFIX }}/login">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="pw-field-wrapper">
                    <input type="password" name="password" id="login-password" class="form-control" required>
                    <button type="button" class="pw-toggle-eye" onclick="togglePasswordVisibility(this)" tabindex="-1" title="パスワードを表示">
                        <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-off-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-login">ログイン</button>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function togglePasswordVisibility(btn) {
    var input = btn.previousElementSibling;
    var eyeIcon = btn.querySelector('.eye-icon');
    var eyeOffIcon = btn.querySelector('.eye-off-icon');
    if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.style.display = 'none';
        eyeOffIcon.style.display = 'inline';
    } else {
        input.type = 'password';
        eyeIcon.style.display = 'inline';
        eyeOffIcon.style.display = 'none';
    }
}
</script>
{% endblock %}
