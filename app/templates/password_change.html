{% extends "base.html" %}
{% block title %}パスワード変更 - Log Server{% endblock %}
{% block extra_css %}
<style>
    .pw-form {
        max-width: 400px;
        margin: 0 auto;
        background: var(--bg-table-td);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 24px;
    }
    .pw-form h3 { color: var(--text-primary); margin-bottom: 20px; }
    .pw-form label { color: var(--text-secondary); font-size: 13px; }
    .pw-form .form-control {
        background: var(--bg-log-odd);
        border-color: var(--border-color);
        color: var(--text-primary);
    }
    .pw-form .form-control:focus {
        background: var(--bg-log-odd);
        color: var(--text-primary);
        border-color: #5a9fd4;
        box-shadow: 0 0 0 0.2rem rgba(90,159,212,0.25);
    }
    .pw-form .btn-primary {
        width: 100%;
        margin-top: 8px;
    }
    .alert { font-size: 14px; }

</style>
{% endblock %}
{% block content %}
<div class="page-header">
    <a class="page-header-back" href="{{ PREFIX }}/admin">管理メニュー</a>
    <span class="page-header-sep">›</span>
    <span class="page-header-title">パスワード変更</span>
</div>
<div class="pw-form">
    {% if message %}
    <div class="alert alert-success">{{ message }}</div>
    {% endif %}
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ PREFIX }}/password_change">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
            <label for="old_password" class="form-label">現在のパスワード</label>
            <input type="password" class="form-control" id="old_password" name="old_password" required>
        </div>
        <div class="mb-3">
            <label for="new_password" class="form-label">新しいパスワード</label>
            <input type="password" class="form-control" id="new_password" name="new_password" required minlength="4">
        </div>
        <button type="submit" class="btn btn-primary">変更する</button>
    </form>
</div>
{% endblock %}
